}
@media (max-width: 767px){

  function buildNetwork(svg) {

    const pts = [[250, 230], [520, 150], [800, 260], [1250, 210], [1330, 470], [380, 690], [700, 790], [1240, 790]];
    const ns = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs) => { const n = document.createElementNS(ns, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); svg.appendChild(n); return n; };
    mk('circle', { class: 'ring', cx: hub[0], cy: hub[1], r: 120 });
    mk('circle', { class: 'ring', cx: hub[0], cy: hub[1], r: 230 });
    pts.forEach(([x, y], i) => {
      const mx = (x + hub[0]) / 2, my = (y + hub[1]) / 2;
      const lift = 140 + (i % 3) * 60;
      const cxp = mx + (i % 2 ? 60 : -60), cyp = Math.min(y, hub[1]) - lift;
      mk('path', { class: 'arc', d: `M ${hub[0]} ${hub[1]} Q ${cxp} ${cyp} ${x} ${y}` });
    });
    mk('path', { class: 'arc', d: `M 250 230 Q 390 80 520 150` });
    pts.forEach(([x, y]) => mk('circle', { class: 'node', cx: x, cy: y, r: 3 }));
    mk('circle', { class: 'hub-ring', cx: hub[0], cy: hub[1], r: 11 });
    mk('circle', { class: 'hub', cx: hub[0], cy: hub[1], r: 5 });

        b.setAttribute('aria-expanded', String(!open));
        panel.hidden = open;
        if (!open && HAS_LIBS && !RM && PAGE.ctx) PAGE.ctx.add(() => gsap.from(panel.children, { y: 16, opacity: 0, duration: .6, stagger: .06, ease: 'power3.out' }));
        if (HAS_LIBS) gsap.delayedCall(.05, () => ScrollTrigger.refresh());
      });
      b.addEventListener('keydown', e => {
        let j = null;
        if (e.key === 'ArrowDown') j = (i + 1) % btns.length;
        if (e.key === 'ArrowUp') j = (i - 1 + btns.length) % btns.length;
        if (e.key === 'Home') j = 0;
        if (e.key === 'End') j = btns.length - 1;
        if (j !== null) { e.preventDefault(); btns[j].focus(); }
      });
    });
  }

  MOTION.about = (root) => {
    const sec = $('.timeline', root), track = $('.timeline__track', root), bar = $('.tl-progress i', root);
    if (RM) { gsap.set(bar, { scaleX: 1 }); return; }
    PAGE.mm.add('(min-width: 1024px)', () => {
      const dist = () => Math.max(0, track.scrollWidth - document.documentElement.clientWidth);
      const tl = gsap.timeline({ scrollTrigger: { trigger: sec, start: 'top top', end: () => '+=' + dist(), pin: true, scrub: 1, invalidateOnRefresh: true, refreshPriority: 1 } });
      tl.to(track, { x: () => -dist(), ease: 'none' }, 0).fromTo(bar, { scaleX: 0 }, { scaleX: 1, ease: 'none' }, 0);
      $$('.tl-item', track).forEach(it => gsap.from(it, { y: 28, duration: .9, ease: 'power3.out',
        scrollTrigger: { trigger: it, containerAnimation: tl, start: 'left 85%', toggleActions: 'play none none reverse' } }));
    });
    PAGE.mm.add('(max-width: 1023px)', () => {
      gsap.set(bar, { scaleX: 1 });
      $$('.tl-item', track).forEach(it => gsap.from(it, { y: 24, opacity: 0, duration: 1, scrollTrigger: { trigger: it, start: 'top 88%', once: true } }));
    });
  };

  MOTION.expertise = (root) => {
    const links = $$('[data-svc-link]', root);
    const setActive = key => links.forEach(b => b.classList.toggle('is-active', b.dataset.svcLink === key));
    $$('.svc-item', root).forEach(item => ScrollTrigger.create({ trigger: item, start: 'top 55%', end: 'bottom 55%', onToggle: self => self.isActive && setActive(item.dataset.svc) }));
    links.forEach(b => b.addEventListener('click', () => {
      const target = $('#svc-' + b.dataset.svcLink, root);
      lenis.scrollTo(target, { offset: -110, duration: RM ? 0 : 1.2, immediate: RM });
    }));
    const panels = $$('.catpanel', root);
    setupTabs($('.tabs', root), i => {
      panels.forEach((p, k) => { p.hidden = k !== i; });
      if (RM) return;
      const p = panels[i];
      gsap.fromTo($('.media', p), { clipPath: 'inset(0% 100% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1, ease: 'expo.out' });
      gsap.fromTo($('.media img', p), { scale: 1.1 }, { scale: 1, duration: 1.4, ease: 'expo.out' });
      gsap.from($$('.h2, .body, .catpanel__prod', p), { y: 20, opacity: 0, duration: .8, stagger: .07, ease: 'power3.out' });
    });
  };

  MOTION.academy = (root) => { $$('.acc', root).forEach(setupAccordion); };

  MOTION.speaking = () => {};

  MOTION.contact = () => {};

  function preloader() {
    const pre = $('#preloader');
    return new Promise(resolve => {
      let seen = false;
      try { seen = !!sessionStorage.getItem('phtso-seen'); sessionStorage.setItem('phtso-seen', '1'); } catch (e) {}
      if (seen || RM || !HAS_LIBS) { pre.remove(); resolve(); return; }
      const tl = gsap.timeline({ onComplete: () => { pre.remove(); resolve(); } });
      tl.from($$('.pre__letter', pre), { yPercent: 110, duration: .62, ease: 'expo.out', stagger: .07 })
        .to($('.pre__line', pre), { scaleX: 1, duration: .5, ease: 'power3.inOut' }, '-=.3')
        .add(() => { html.classList.remove('is-loading'); playIntro(); }, '+=.02')
        .to(pre, { yPercent: -100, duration: .6, ease: 'power3.inOut' }, '<');
    });
  }

  fillConfig(document);
  applyI18n(document);
  bindButtons(document);
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('resize', () => { placeIndicator(); });

  const boot = async () => {
    const route = parseHash() || { page: 'home', params: new URLSearchParams() };
    window.scrollTo(0, 0);
    try { mountPage(route); current = route; await preloader(); }
    catch (err) { console.error('[boot]', err); }
    finally { html.classList.remove('is-loading'); playIntro(); }
  };
  setTimeout(() => html.classList.remove('is-loading'), 4000);
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1000))]).then(boot);
});
</script>
</body>
</html>
